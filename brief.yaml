# Бриф для директора по науке. Из этого файла собираются:
#   dist/brief_science_director.docx — отправить на заполнение
#   brief_science_director.md        — та же версия в репозитории
# Сборка: python3 -I build/brief.py

title: "Бриф для директора по науке"
subtitle: "Данные о продуктах для материалов производителям БАД и дистрибьюторам пищевого сырья"
version: "11.11.2026"

intro:
  - "Мы готовим материалы для производителей БАД и дистрибьюторов пищевого сырья. Это технологи и закупщики: они проверяют каждую цифру. Поэтому в материалы попадает только то, что вы подтвердите документом."
  - "Мы не спрашиваем о технологии: режимах, ферментах и их дозах, рецептурах, себестоимости. Нам нужно то, что заказчик всё равно получит в спецификации, сертификате анализа или документе о регистрации."
  - "Без вашей подписи в разделе Г ничего не будет опубликовано."

how_to:
  - "Если ответ есть в ТУ, спецификации или протоколе — не переписывайте: приложите документ и укажите пункт или страницу."
  - "Если не хотите раскрывать — напишите «не раскрываем». В материалах будет «по запросу», клиент получит ответ от вас напрямую."
  - "Если данных нет — напишите «нет». Это тоже ответ: мы не будем его додумывать."
  - "В колонке «Публикация» отметьте одно: О — можно в открытые материалы; З — только клиенту по запросу; NDA — только под соглашение о неразглашении."

filler:
  - "ФИО, должность"
  - "Телефон, электронная почта для технологических вопросов клиентов"
  - "Дата заполнения"

common:
  title: "А. Общее для всех продуктов (заполняется один раз)"
  questions:
    - id: A-1
      q: "Адрес производственной площадки (как на маркировке)"
    - id: A-2
      q: "Сертификаты системы менеджмента безопасности (GMP, ISO 22000, FSSC 22000, ХАССП): стандарт, орган, номер, срок действия. На какие продукты распространяется область действия?"
      hint: "Приложите сертификат вместе с приложением об области действия."
    - id: A-3
      q: "Где проводятся испытания партий: своя лаборатория или внешняя? Аккредитация (номер в реестре Росаккредитации)."
    - id: A-4
      q: "Коллекция, в которой депонированы производственные штаммы (ВКПМ, ВКМ, собственная и т. п.). Номера штаммов — только если готовы раскрыть."
    - id: A-5
      q: "Прослеживаемость: как обозначается партия, хранятся ли контрольные образцы каждой партии и сколько."
    - id: A-6
      q: "Образцы для клиентов: какой объём, что прикладывается (спецификация, сертификат анализа партии), кто принимает решение."
    - id: A-7
      q: "Какие формулировки с сайта завода о продуктах устарели или неточны?"

product_card:
  title: "Б. Карточка продукта"
  note: "Одна карточка — один продукт. Если продукт выпускается в нескольких вариантах (с консервантом и без, разные фасовки), укажите это в Б-6."
  groups:
    - name: "Что это"
      questions:
        - id: Б-1
          q: "Что это за продукт — одной фразой для технолога заказчика (категория и происхождение: лизат, гидролизат, ферментат, экстракт, иное; из чего получен)."
        - id: Б-2
          q: "Статус: выпускается серийно / опытные партии / в разработке / снят с производства."
        - id: Б-3
          q: "Исходный биологический материал: виды микроорганизмов в современной номенклатуре или иное сырьё и его происхождение (животное, растительное, микробное)."
        - id: Б-4
          q: "Нормативный документ на продукт (ТУ, СТО): номер, дата."
    - name: "Регистрация и применение"
      questions:
        - id: Б-5
          q: "СГР или декларация ЕАЭС: номер, дата, в каком качестве зарегистрирован (БАД, пищевой ингредиент, иное). Разрешённая область применения по ТУ и документу о регистрации."
          hint: "Если продукт предназначен также для кормов, косметики или ветеринарии — укажите. В наши материалы попадёт только пищевое применение и БАД."
    - name: "Состав и маркировка"
      questions:
        - id: Б-6
          q: "Состав для этикетки в порядке убывания: активный компонент, носитель, консерванты, прочее. Варианты продукта."
        - id: Б-7
          q: "Аллергены (в том числе молоко, лактоза, соя, глютен), ГМО, компоненты животного происхождения. Есть ли сертификаты халяль или кошер."
    - name: "Качество"
      questions:
        - id: Б-8
          q: "Форма и внешний вид. Нормируемые показатели и их нормы (или пункт ТУ)."
        - id: Б-9
          q: "В чём выражается количество активного компонента (сухое вещество, белок, исходная клеточная масса, иное) и каким методом это контролируется (название метода или ГОСТ)."
        - id: Б-10
          q: "Для продуктов из микроорганизмов: подтверждение отсутствия жизнеспособных клеток — метод, предел обнаружения, входит ли в каждый сертификат анализа."
        - id: Б-11
          q: "Показатели безопасности: микробиология, токсичные элементы, остаточные количества — с нормами. Кто испытывает."
    - name: "Хранение и переработка у клиента"
      questions:
        - id: Б-12
          q: "Срок годности в закрытой упаковке и после вскрытия. Условия хранения и перевозки: температура, нужна ли холодовая цепь, допустимо ли замораживание."
        - id: Б-13
          q: "Устойчивость при переработке у клиента, если известно: нагрев, pH, смешивание с другими компонентами."
        - id: Б-14
          q: "Рекомендуемые формы выпуска и норма ввода (на дозу или на кг продукта). В какие формы вводить не рекомендуете."
        - id: Б-15
          q: "Для каких задач продукт не подходит; типичные ошибки клиентов при применении."
    - name: "Доказательная база и отличия"
      questions:
        - id: Б-16
          q: "Открытые публикации и патенты по этому продукту или его штаммам: ссылки или номера."
          hint: "В рекламные материалы данные об эффективности не пойдут без проверки специалистом по регистрации. Список нужен, чтобы отвечать на вопросы технологов."
        - id: Б-17
          q: "Чем продукт отличается от аналогов на рынке — только проверяемые факты (состав, происхождение штаммов, форма, документы). Без оценок вроде «лучший»."
    - name: "Документы для клиента"
      questions:
        - id: Б-18
          q: "Что из этого можно передать клиенту по запросу (отметьте и укажите, есть ли уже готовый файл): спецификация; сертификаты анализа (сколько последних партий); СГР или декларация; протоколы испытаний; декларация аллергенов; сертификат халяль/кошер; паспорт безопасности."

products:
  - name: "Cavitol"
    known: "Нам известно только название. Ни спецификации, ни описания нет — поэтому продукт пока не включён в материалы."
    focus: "Особенно важны Б-1, Б-2, Б-3, Б-5: что это за продукт и разрешён ли он для пищевых продуктов и БАД."
  - name: "ProteoLyse"
    known: "Нам известно только название. Ни спецификации, ни описания нет — поэтому продукт пока не включён в материалы."
    focus: "Особенно важны Б-1, Б-3 (происхождение белка или микроорганизмов), Б-5 и Б-7 (аллергены)."
  - name: "«ФерЛиз Про»"
    known: "Нам известно только название. Ни спецификации, ни описания нет — поэтому продукт пока не включён в материалы."
    focus: "Особенно важны Б-1, Б-2, Б-3 и Б-5. Отдельно: чем продукт отличается от «БифиЛиза», «ЛактоЛиза» и «ПропиоЛиза» (Б-17)."
  - name: "«БифиЛиз»"
    known: "С сайта завода (не подтверждено документом): 6 штаммов; виды B. longum, B. bifidum, B. adolescentis; ферментативный гидролиз клеточных стенок; жидкость; носитель — молочная сыворотка; сорбиновая кислота по запросу; для пищевой промышленности и БАД. Подтвердите или исправьте."
    focus: "Б-3, Б-6, Б-9, Б-10, Б-12."
  - name: "«ЛактоЛиз»"
    known: "С сайта завода (не подтверждено документом): 6–8 штаммов; виды L. acidophilus, L. fermentum, L. bulgaricus, S. thermophilus; жидкость; носитель — молочная сыворотка. Подтвердите или исправьте."
    focus: "Б-3: «6–8 штаммов» — это разные варианты продукта или разброс? Как виды записаны в документах после переименования 2020 года (L. fermentum → Limosilactobacillus fermentum, L. bulgaricus → L. delbrueckii subsp. bulgaricus)?"
  - name: "«ПропиоЛиз»"
    known: "С сайта завода (не подтверждено документом): 2 штамма P. shermanii; жидкость; носитель — молочная сыворотка. Подтвердите или исправьте."
    focus: "Б-3: как вид записан в документах (P. freudenreichii subsp. shermanii?)."

not_asked:
  title: "В. Что мы не спрашиваем"
  intro: "Это ноу-хау завода. Клиенту оно не нужно. Если что-то из этого всё же окажется в ответе — мы не будем это публиковать."
  items:
    - "Режимы культивирования и гидролиза, используемые ферменты и их дозы."
    - "Рецептуры сред и носителя сверх состава для этикетки."
    - "Паспорта штаммов, их генетические данные и номера, если вы их не раскрываете."
    - "Себестоимость, поставщиков сырья, полную мощность производства."
    - "Неопубликованные результаты исследований."
  commercial: "Цены, минимальная партия, сроки отгрузки и условия для дистрибьюторов — это вопросы к коммерческой службе. Их мы направим отдельно."

signoff:
  title: "Г. Согласование"
  text: "Ответы, отмеченные «О», можно использовать в открытых материалах для производителей БАД и дистрибьюторов пищевого сырья. Перед публикацией текст материалов будет направлен на проверку технологу завода."
  fields: ["ФИО, должность", "Подпись", "Дата"]
