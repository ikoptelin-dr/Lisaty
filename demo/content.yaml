hero:
  eyebrow: { ru: "Сырьё для БАД и пищевых продуктов · Кольцово", en: "Raw material for supplements and foods · Koltsovo, Russia" }
  h1:
    ru: ["Лизаты пробиотических бактерий", "— сырьё с *проверяемой* спецификацией"]
    en: ["Probiotic bacterial lysates", "with a *traceable* specification"]
  sub:
    ru: "Жидкое сырьё для БАД и пищевых продуктов. Каждая цифра на странице связана с источником: документом завода, публикацией или протоколом."
    en: "Liquid raw material for food supplements and foods. Every figure on this page links to its source: a plant document, a publication or a test report."
  keys:
    - { href: "#request", icon: flask, ru: "Запросить образец", en: "Request a sample" }
    - { href: "#request", icon: doc, ru: "Скачать спецификацию", en: "Get the specification" }
  caption: { ru: "материал <<v0.3-demo>> · <<12.11.2026>> · все цифры — из реестра claims.yaml", en: "material <<v0.3-demo>> · <<12.11.2026>> · every figure comes from claims.yaml" }
  panel:
    query: { ru: "ПропиоЛиз — спецификация", en: "PropioLyz — specification" }
    mode: { ru: "Спецификация", en: "Specification" }
    rows:
      - { icon: drop, label: { ru: "Сухие вещества", en: "Dry matter" }, value: "{{S-DM-PRO}}", chip: { ru: "ТУ", en: "Spec" } }
      - { icon: ph, label: { ru: "pH", en: "pH" }, value: "{{S-PH-PRO}}", chip: { ru: "ТУ", en: "Spec" } }
      - { icon: vial, label: { ru: "Витамин <<B12>>", en: "Vitamin <<B12>>" }, value: "{{S-B12-PRO}}", chip: { ru: "UHPLC", en: "UHPLC" } }
      - { icon: dish, label: { ru: "Живые клетки", en: "Viable cells" }, value: "{{S-VIAB}}", chip: { ru: "Посев", en: "Plate count" } }
    hints: { ru: "↑↓ показатель · ↵ источник · esc закрыть", en: "↑↓ parameter · ↵ source · esc close" }
  badge:
    title: { ru: "Демо на синтетических данных", en: "Demo on synthetic data" }
    text: { ru: "S — синтетическое значение, не данные завода", en: "S — synthetic value, not plant data" }
  ghost: { href: "#director", ru: "Как устроено согласование", en: "How sign-off works" }

legend:
  title: { ru: "Как читать метки", en: "How to read the marks" }
  items:
    - { mark: "S", cls: s, ru: "синтетическое значение для демонстрации — не данные завода", en: "synthetic value for the demo — not plant data" }
    - { mark: "Д", mark_en: "D", cls: d, ru: "документ или публичное заявление завода — с дословной цитатой в реестре", en: "plant document or public statement — quoted verbatim in the register" }
    - { mark: "[ ]", cls: l, ru: "публикация с DOI — фраза сверена с аннотацией", en: "publication with a DOI — wording checked against the abstract" }

tech:
  title: { ru: "Как разрушают клетку — и что из этого измеримо", en: "How the cell is disrupted — and what can be measured" }
  intro:
    ru: "Сравнение способов лизиса по литературе. Параметры процессов завода здесь не раскрываются."
    en: "Lysis methods compared from the literature. The plant’s process parameters are not disclosed here."
  head:
    ru: ["Способ", "Что разрушается", "Что получается", "Чем измеряется"]
    en: ["Method", "What is disrupted", "What results", "How it is measured"]
  rows:
    - method: { ru: "Ферментативный гидролиз", en: "Enzymatic hydrolysis" }
      note: "{{P-TECH}}"
      breaks: "{{L-ENZ}}"
      yields: "{{P-DEF}}"
      measured: { ru: "Источник не найден — заполняет директор по науке", en: "No source found — to be completed by the scientific director" }
      gap: true
    - method: { ru: "Гидродинамическая кавитация", en: "Hydrodynamic cavitation" }
      breaks: "{{L-CAV-MECH}}"
      yields: "{{L-CAV-SEL}}"
      measured: "{{L-CAV-MEAS}}"
    - method: { ru: "Протеолиз", en: "Proteolysis" }
      breaks: { ru: "Источник не найден", en: "No source found" }
      yields: { ru: "Источник не найден", en: "No source found" }
      measured: { ru: "Публикацию о протеолизе как способе лизиса пробиотических бактерий найти не удалось. Строку заполняет директор по науке.", en: "No publication on proteolysis as a lysis method for probiotic bacteria was found. To be completed by the scientific director." }
      gap: true
  foot: "{{L-CHOICE}}"

products:
  title: { ru: "Продукты", en: "Products" }
  intro:
    ru: "Названия, виды и число штаммов — с сайта завода. Показатели качества — синтетические, для демонстрации формы спецификации."
    en: "Names, species and strain counts are from the plant website. Quality figures are synthetic and show the specification layout only."
  items:
    - name: { ru: "«БифиЛиз»", en: "BifiLyz" }
      kind: { ru: "Лизат бифидобактерий жидкий", en: "Liquid bifidobacteria lysate" }
      status: doc
      rows:
        - { label: { ru: "Штаммы", en: "Strains" }, value: "{{P-BIF-SP}}" }
        - { label: { ru: "Сухие вещества", en: "Dry matter" }, value: "{{S-DM-BIF}}" }
        - { label: { ru: "pH", en: "pH" }, value: "{{S-PH-BIF}}" }
        - { label: { ru: "Белок", en: "Protein" }, value: "{{S-PROT}}" }
        - { label: { ru: "Живые клетки", en: "Viable cells" }, value: "{{S-VIAB}}" }
    - name: { ru: "«ЛактоЛиз»", en: "LaktoLyz" }
      kind: { ru: "Лизат лактобактерий жидкий", en: "Liquid lactobacilli lysate" }
      status: doc
      rows:
        - { label: { ru: "Штаммы", en: "Strains" }, value: "{{P-LAK-SP}}" }
        - { label: { ru: "Номенклатура", en: "Nomenclature" }, value: "{{L-LACTO-TAX}}" }
        - { label: { ru: "Сухие вещества", en: "Dry matter" }, value: "{{S-DM-LAK}}" }
        - { label: { ru: "pH", en: "pH" }, value: "{{S-PH-LAK}}" }
        - { label: { ru: "Живые клетки", en: "Viable cells" }, value: "{{S-VIAB}}" }
    - name: { ru: "«ПропиоЛиз»", en: "PropioLyz" }
      kind: { ru: "Лизат пропионовокислых бактерий жидкий", en: "Liquid propionibacteria lysate" }
      status: doc
      rows:
        - { label: { ru: "Штаммы", en: "Strains" }, value: "{{P-PRO-SP}}" }
        - { label: { ru: "Номенклатура", en: "Nomenclature" }, value: "{{L-PF-SUBSP}}" }
        - { label: { ru: "Сухие вещества", en: "Dry matter" }, value: "{{S-DM-PRO}}" }
        - { label: { ru: "Витамин <<B12>>", en: "Vitamin <<B12>>" }, value: "{{S-B12-PRO}}" }
        - { label: { ru: "Живые клетки", en: "Viable cells" }, value: "{{S-VIAB}}" }
    - name: { ru: "Cavitol", en: "Cavitol" }
      kind: { ru: "Состав не подтверждён", en: "Composition not confirmed" }
      status: unconfirmed
      rows:
        - { label: { ru: "Тип", en: "Type" }, value: "{{S-CAV-TYPE}}" }
        - { label: { ru: "Основа", en: "Base" }, value: "{{S-CAV-BASE}}" }
    - name: { ru: "ProteoLyse", en: "ProteoLyse" }
      kind: { ru: "Состав не подтверждён", en: "Composition not confirmed" }
