  common:
    - { label: { ru: "Состав", en: "Composition" }, value: "{{P-COMP}}" }
    - { label: { ru: "Консервант", en: "Preservative" }, value: "{{P-SORBIC}}" }
    - { label: { ru: "Категория", en: "Category" }, value: "{{P-CATEGORY}}" }
    - { label: { ru: "Хранение", en: "Storage" }, value: "{{P-STORAGE}}" }
