# Демо-лендинг: тексты обеих страниц (ru — index.html, en — en.html).
# Разметка внутри строк:
#   {{ID}}      — утверждение из claims.yaml (текст на языке страницы + метка класса данных)
#   <<текст>>   — разрешённый идентификатор с цифрами (регламент, версия, дата материала)
#   *слово*     — тёплый градиент (только в заголовке, одно слово)
# В остальном тексте цифры запрещены — их ловит линтер demo/build.mjs.

meta:
