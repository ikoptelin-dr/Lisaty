      ru: "Все виды из состава лизатов, включая Propionibacterium freudenreichii, есть в списке QPS EFSA (17.09.2026) — при условии, что у штаммов нет приобретённых генов устойчивости к клинически значимым антимикробным препаратам"
      en: "Every species in the lysates, including Propionibacterium freudenreichii, is on EFSA’s QPS list (17.09.2026) — on condition that the strains carry no acquired resistance genes to clinically relevant antimicrobials"
    source: { file: "text/qps_list_PS24.txt", page: "лист «QPS List»", quote: "Propionibacterium | Propionibacterium freudenreichii | The strains should not harbour any acquired antimicrobial resistance genes to clinically relevant antimicrobials." }
  - id: L-CAV-SEL
    data_class: literature
    evidence: "in vitro"
    evidence_note: "E. coli, не пробиотические бактерии"
    status: "подтверждено"
    ref: REF-BALA
    text:
      ru: "Гидродинамическая кавитация разрушает клетки частично и избирательно: у E. coli высвободилось 48 % растворимого белка и 88 % периплазматического фермента от максимума"
      en: "Hydrodynamic cavitation disrupts cells partially and selectively: in E. coli it released 48% of soluble protein and 88% of a periplasmic enzyme relative to the maximum"
    source: { file: "literature/abstracts/10.1021_bp0502173.txt", page: "аннотация", quote: "48% of the total soluble protein, 88% of acid phosphatase" }
  - id: L-CAV-MEAS
    data_class: literature
    evidence: "in vitro"
    status: "подтверждено"
    ref: REF-BALA
    text:
      ru: "Степень разрушения измеряют по растворимому белку, ферментам-маркерам и электрофорезу (SDS-PAGE)"
      en: "Disruption is measured by soluble protein, marker enzymes and SDS-PAGE"
    source: { file: "literature/abstracts/10.1021_bp0502173.txt", page: "аннотация", quote: "supported by SDS-PAGE analysis" }
  - id: L-CAV-MECH
    data_class: literature
    evidence: "нет данных"
    evidence_note: "обзор"
    status: "подтверждено"
    ref: REF-ZUPANC
    text:
      ru: "Механизм разрушения клеток пузырьками кавитации до конца не объяснён"
      en: "How cavitation bubbles destroy cells is still not fully explained"
    source: { file: "literature/abstracts/10.1016_j.ultsonch.2019.05.009.txt", page: "аннотация", quote: "What precisely are the mechanisms how bubbles can" }
  - id: L-ENZ
    data_class: literature
    evidence: "нет данных"
    evidence_note: "обзор"
    status: "подтверждено"
    ref: REF-SALAZAR
    text:
      ru: "Литические ферменты клеточной стенки (классический — лизоцим) применяют для выделения внутриклеточных продуктов бактерий и дрожжей"
      en: "Cell-wall lytic enzymes (lysozyme being the classic one) are used to recover intracellular products from bacteria and yeast"
    source: { file: "literature/abstracts/10.1007_s10529-007-9345-2.txt", page: "аннотация", quote: "recovering of intracellular products from yeast or bacteria" }
  - id: L-CHOICE
    data_class: literature
    evidence: "нет данных"
    evidence_note: "обзор"
    status: "подтверждено"
    ref: REF-GOMES
    text:
      ru: "Выбор способа разрушения зависит от состава клеточной стенки, природы целевых молекул, чистоты, масштабируемости и затрат энергии"
      en: "The choice of disruption method depends on cell-wall composition, the target molecules, purity, scalability and energy input"
    source: { file: "literature/abstracts/10.1080_10826068.2020.1728696.txt", page: "аннотация", quote: "cell wall composition, nature of biomolecule, purity degree, scalability, and energy input" }

