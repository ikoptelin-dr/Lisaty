producers:
  title: "Производителям и владельцам брендов БАД"
  intro: "Ответы на вопросы, которые технолог задаёт до заказа образца."
  items:
    - q: "Чем это сырьё отличит ваш продукт"
      a: "Решать вам по спецификации: виды бактерий и число штаммов в составе. Мы не сравниваем себя с другими поставщиками."
      values: [{ claim: C-BIF-03 }, { claim: C-LAK-03 }, { claim: C-PRO-03 }]
    - q: "Что можно писать на этикетке"
      a: "Формулировки о пользе определяют документы о регистрации вашего продукта и требования ТР ТС 021/2011 и ТР ТС 022/2011. Мы таких формулировок не предлагаем."
    - q: "В какие формы выпуска входит"
      a: "Если сырьё жидкое, его проще вводить в жидкие формы. Для твёрдых форм нужен отдельный этап у вас — проверьте с технологом до заказа."
      values: [{ claim: C-FORMS-01 }]
    - q: "Документы для регистрации вашего продукта"
      a: "Запросите спецификацию, документ о регистрации сырья и сертификаты анализа партий."
      values: [{ claim: C-REG-01 }, { claim: C-STAB-01 }]
    - q: "Аллерген на маркировке"
      a: "Состав носителя определяет, что вы укажете на этикетке."
      values: [{ claim: C-ALLERG-01 }]
    - q: "Цена на дозу"
      a: "Цена на дозу считается из цены за единицу сырья и нормы ввода. Обе величины пришлём по запросу."
      values: [{ claim: C-DOSE-01 }, { claim: C-PRICE-01 }]

distributors:
  title: "Дистрибьюторам пищевого и БАД-сырья"
  intro: "Ответы на вопросы, которые задают до включения сырья в ассортимент."
  items:
    - q: "Качество от партии к партии"
      a: "Запросите сертификаты анализа последних партий и сравните их сами."
      values: [{ claim: C-STAB-01 }]
    - q: "Пакет документов для клиентов"
      a: "Спецификация, документ о регистрации, сертификаты системы менеджмента с областью действия."
      values: [{ claim: C-REG-01 }, { claim: C-CERT-01 }]
    - q: "Минимальная партия и сроки"
      values: [{ claim: C-MOQ-01 }, { claim: C-LEAD-01 }, { claim: C-PACK-01 }]
    - q: "Хранение и перевозка"
      a: "Режим хранения влияет на склад и транспорт. Проверьте его до первой закупки."
      values: [{ claim: C-STOR-01 }, { claim: C-SHELF-01 }]
    - q: "Условия работы и эксклюзив"
      values: [{ claim: C-EXCL-01 }]

documents:
  title: "Документы и качество"
  intro: "В таблице — только документы, которые есть у нас на руках. Остальные запрашиваем у производителя."
  rows:
    - { label: "Спецификация", value: { claim: C-COMP-01 } }
    - { label: "Отсутствие живых клеток", value: { claim: C-INACT-01 } }
    - { label: "Безопасность", value: { claim: C-SAFE-01 } }
    - { label: "Сертификаты анализа партий", value: { claim: C-STAB-01 } }
    - { label: "Регистрация сырья", value: { claim: C-REG-01 } }
    - { label: "Система менеджмента", value: { claim: C-CERT-01 } }
    - { label: "Срок годности", value: { claim: C-SHELF-01 } }

limitations:
  title: "Ограничения — до заказа"
  intro: "Это стоит проверить заранее, чтобы образец не оказался лишним."
  items:
    - title: "Форма выпуска"
      text: "Если сырьё жидкое, для капсул и таблеток понадобится сорбция или сушка на вашей стороне."
      values: [{ claim: C-FORM-01 }]
    - title: "Молочный носитель"
      text: "Если носитель молочный, укажите молоко как аллерген. Такое сырьё не подойдёт для линеек без молока и веганских."
      values: [{ claim: C-CARR-01 }, { claim: C-ALLERG-01 }]
    - title: "Хранение"
      text: "Сверьте срок годности и режим хранения со своим циклом производства и складом."
      values: [{ claim: C-STOR-01 }, { claim: C-SHELF-01 }]
    - title: "Для каких задач не подходит"
      text: "Лизат — это разрушенные клетки бактерий. Если вашему продукту нужны живые культуры, например закваска, лизат эту задачу не решает. Это сырьё, а не готовый продукт."

request:
  title: "Запросить образец и спецификацию"
  intro: "Заполните форму. Пришлём то, что есть по вашему списку. Если документа нет — так и напишем."
  submit: "Отправить запрос"
  consent: "Согласен на обработку персональных данных для ответа на этот запрос."
  fields:
    - { name: company, label: "Компания", type: text, required: true, autocomplete: organization }
    - { name: role, label: "Вы", type: select, required: true, options: ["Производитель или владелец бренда БАД", "Дистрибьютор сырья", "Пищевое производство", "Другое"] }
    - { name: products, label: "Какой продукт", type: checkboxes, options_from: products }
    - { name: need, label: "Что прислать", type: checkboxes, options: ["Образец", "Спецификацию", "Сертификаты анализа партий", "Документы о регистрации", "Коммерческое предложение"] }
    - { name: format, label: "Форма выпуска вашего продукта", type: text, required: false }
    - { name: volume, label: "Ориентировочный объём в год", type: text, required: false }
    - { name: name, label: "Имя и должность", type: text, required: true, autocomplete: name }
    - { name: email, label: "Электронная почта", type: email, required: true, autocomplete: email }
    - { name: phone, label: "Телефон", type: tel, required: false, autocomplete: tel }
    - { name: comment, label: "Комментарий", type: textarea, required: false }
  pdf_steps:
    - "Напишите нам на почту или позвоните."
    - "Укажите продукт, форму выпуска вашего продукта и что прислать: образец, спецификацию, сертификаты анализа, документы о регистрации, коммерческое предложение."
    - "Пришлём то, что есть по вашему списку. Если документа нет — так и напишем."

