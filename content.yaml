# Весь текст лендинга и PDF. Обе версии собираются только отсюда.
#
# Два типа значений:
#   "строка"        — служебный текст (заголовки, пояснения, кнопки). В нём запрещены
#                     цифры, латинские названия видов, единицы, сертификаты, превосходные
#                     степени и медицинские слова — линтер в build/build.mjs.
#   { claim: ID }   — факт. Берётся из claims.yaml. Если статус не «подтверждено»,
#                     чистовая сборка падает, черновая ставит placeholder.
#
# Цифры вне claims.yaml допускаются только в списке allow_numbers ниже
# (ссылки на техрегламенты и дата версии) — их тоже сверяет check_numbers.

meta:
  lang: ru
  title: "Бактериальные лизаты — образец и спецификация"
  description: "Бактериальные лизаты для производителей БАД и дистрибьюторов пищевого сырья. Запросите образец и спецификацию."
  version_date: "11.11.2026"
  allow_numbers: ["ТР ТС 021/2011", "ТР ТС 022/2011", "11.11.2026"]

draft_banner: "Черновик. Документы производителя ещё не получены. Не для рассылки."

how_to_read: "«По запросу» значит: этих данных нет в открытых материалах. Их можно запросить через форму. Мы не публикуем цифры без документа."

